# Include this file once from Nginx Proxy Manager's custom/http.conf.
# Certificate paths and network membership are verified for this server.
server {
    listen 80;
    listen [::]:80;
    server_name kyc.dilanp.duckdns.org;
    return 301 https://kyc.dilanp.duckdns.org$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kyc.dilanp.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/npm-2/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-2/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    access_log /data/logs/kyc-chain_access.log;
    error_log /data/logs/kyc-chain_error.log warn;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $kyc_upstream kyc-chain:4310;
        proxy_pass http://$kyc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_set_header Connection "";
    }
}
